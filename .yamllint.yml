# YAML linting configuration for BC Government Actions
# Reference: https://yamllint.readthedocs.io/

extends: default

rules:
  # Indentation must be consistent
  indentation:
    spaces: 2
    indent-sequences: true
    check-multi-line-strings: false

  # Line length - GitHub workflows can be long
  line-length:
    max: 120
    level: warning

  # Comments
  comments:
    min-spaces-from-content: 1
    require-starting-space: true

  # Colons in mappings
  colons:
    max-spaces-before: 0
    max-spaces-after: 1

  # Commas in flows
  commas:
    max-spaces-before: 0
    max-spaces-after: 1

  # Document markers (allow explicit start/end)
  document-start: disable
  document-end: disable

  # Multiple documents in single file (disabled for workflows)
  multi-document-start: disable

  # Trailing spaces
  trailing-spaces: enable

  # Truthy values (yes/no should be quoted)
  truthy:
    allowed: ['true', 'false']
    check-keys: true

  # Brackets
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 0

  # Braces
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 0

  # Key duplicates
  key-duplicates: enable

  # Keys sorting (not enforced - order matters in GitHub Actions)
  key-ordering: disable

  # No tabs
  no-tabs: enable

  # Spaces instead of tabs
  spaces: enable
