name: 'NSG JIT Rule'
description: 'Create or update a Network Security Group (NSG) just-in-time (JIT) access rule'
author: 'BC Government'

inputs:
  subscription-id:
    description: 'Azure Subscription ID'
    required: true
  resource-group:
    description: 'Azure Resource Group name'
    required: true
  nsg-name:
    description: 'Network Security Group name'
    required: true
  rule-name:
    description: 'Name for the JIT access rule'
    required: true
  destination-ports:
    description: 'Destination ports (comma-separated or range, e.g., "80,443" or "3389")'
    required: true
  protocol:
    description: 'Protocol (Tcp, Udp, or *)'
    required: true
    default: 'Tcp'
  direction:
    description: 'Rule direction (Inbound or Outbound)'
    required: true
    default: 'Inbound'
  destination-prefix:
    description: 'Destination address prefix (e.g., "*" or specific IP/subnet)'
    required: true
    default: '*'
  source-address-prefix:
    description: 'Source address prefix for the rule'
    required: false
    default: '*'
  priority:
    description: 'Rule priority (100-4096)'
    required: false

outputs:
  rule-id:
    description: 'Resource ID of the created NSG rule'
  rule-name:
    description: 'Name of the NSG rule (for cleanup/verification)'
  nsg-name:
    description: 'Name of the NSG (for cleanup operations)'
  resource-group:
    description: 'Resource group name (for cleanup operations)'
  subscription-id:
    description: 'Subscription ID (for audit/cleanup operations)'
  source-ip:
    description: 'GitHub runner private IP address'
  source-cidr:
    description: 'Source CIDR used for rule (IP/32)'
  pre-state:
    description: 'Previous NSG state before rule creation (JSON)'
  post-state:
    description: 'Current NSG rule state after creation (JSON)'
  status:
    description: 'Operation status (created, failed, etc.)'
  timestamp:
    description: 'ISO 8601 timestamp of operation'
  error:
    description: 'Error message if operation failed (only set on failure)'

runs:
  using: 'node22'
  main: 'index.js'
  post: 'cleanup.js'
  post-if: 'always()'
