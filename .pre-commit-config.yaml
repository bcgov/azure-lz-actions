# Pre-commit hooks configuration for BC Government Actions
# Installation: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files
# Run on single file: pre-commit run --files <file>
# Reference: https://pre-commit.com/

repos:
  # General fixes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
        args: ['--unsafe']
      - id: check-json

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint.yml]

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.13.0
    hooks:
      - id: markdownlint-cli2
        exclude: '^(CODE_OF_CONDUCT|LICENSE|CONTRIBUTING)\.md$'

# Configure behavior
default_language_version:
  python: python3.13

# Exclude certain files/directories
exclude: |
  (?x)^(
    node_modules/|
    \.git/|
    dist/|
    build/
  )$

# Minimum pre-commit version required
minimum_pre_commit_version: '2.15.0'
