name: NSG Edit Reusable Workflow Test
run-name: NSG Edit Test

on:
  workflow_dispatch:
    inputs:
      azure_subscription_id:
        description: Azure subscription ID for this run (optional; falls back to secret)
        required: false
        default: "f73ac333-25d0-4d7e-97e6-b5382ec63df5"
      azure_resource_group:
        description: Azure resource group containing the NSG
        required: true
        default: e833c2-dev-networking
      azure_nsg_name:
        description: Network Security Group name
        required: true
        default: default
      azure_rule_base_name:
        description: Base name for temporary rule (run id will be appended)
        required: true
        default: gha-runner-temp-allow
      azure_rule_priority:
        description: NSG rule priority
        required: true
        default: "3000"
      azure_dest_ports:
        description: Destination ports (single value or space-separated)
        required: true
        default: "443"
      azure_protocol:
        description: NSG protocol
        required: true
        default: Tcp
      azure_direction:
        description: NSG direction
        required: true
        default: Inbound
      azure_destination_prefix:
        description: Destination address prefix
        required: true
        default: "*"

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ github.event.inputs.azure_subscription_id || secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  AZURE_RESOURCE_GROUP: ${{ github.event.inputs.azure_resource_group }}
  AZURE_NSG_NAME: ${{ github.event.inputs.azure_nsg_name }}
  AZURE_RULE_BASE_NAME: ${{ github.event.inputs.azure_rule_base_name }}
  AZURE_RULE_PRIORITY: ${{ github.event.inputs.azure_rule_priority }}
  AZURE_DEST_PORTS: ${{ github.event.inputs.azure_dest_ports }}
  AZURE_PROTOCOL: ${{ github.event.inputs.azure_protocol }}
  AZURE_DIRECTION: ${{ github.event.inputs.azure_direction }}
  AZURE_DESTINATION_PREFIX: ${{ github.event.inputs.azure_destination_prefix }}

jobs:
  nsg-runner-ip-allowlist-test:
    name: NSG temporary allowlist by runner IP
    runs-on:
      group: bcgov-azure-lz-forge-github-managed-runners # GitHub Managed Runners injected into an Azure VNet

    steps:
      - name: Resolve runner private IP
        id: runner_ip
        shell: bash
        run: |
          set -euo pipefail

          RUNNER_PRIVATE_IP="$(ip -4 route get 1.1.1.1 | awk '{for (i=1;i<=NF;i++) if ($i=="src") {print $(i+1); exit}}')"
          if [[ ! "$RUNNER_PRIVATE_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Failed to resolve private IPv4 from routing table."
            exit 1
          fi

          echo "runner_ip=$RUNNER_PRIVATE_IP" >> "$GITHUB_OUTPUT"
          echo "runner_private_ip=$RUNNER_PRIVATE_IP" >> "$GITHUB_OUTPUT"
          echo "Resolved runner private IP (VNet/internal): $RUNNER_PRIVATE_IP"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow target values:"
          echo "  AZURE_SUBSCRIPTION_ID=$AZURE_SUBSCRIPTION_ID"
          echo "  AZURE_RESOURCE_GROUP=$AZURE_RESOURCE_GROUP"
          echo "  AZURE_NSG_NAME=$AZURE_NSG_NAME"

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

          echo "Authenticated Azure context:"
          az account show --query "{subscriptionId:id,subscriptionName:name,tenantId:tenantId,environment:environmentName,user:user.name}" -o table

      - name: Validate target resource group and NSG exist
        shell: bash
        run: |
          set -euo pipefail

          echo "Validation context:"
          az account show --query "{subscriptionId:id,subscriptionName:name,tenantId:tenantId}" -o table
          echo "Target resource group: $AZURE_RESOURCE_GROUP"
          echo "Target NSG: $AZURE_NSG_NAME"

          if ! az group exists --name "$AZURE_RESOURCE_GROUP" | grep -qi true; then
            echo "Resource group not found in current subscription: $AZURE_RESOURCE_GROUP"
            echo "Listing top resource groups for troubleshooting:"
            az group list --query "[].{name:name,location:location}" -o table
            echo "Searching for NSGs with the requested name across the subscription:"
            az network nsg list --query "[?name=='$AZURE_NSG_NAME'].{name:name,resourceGroup:resourceGroup,location:location}" -o table
            exit 3
          fi

          if ! az network nsg show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_NSG_NAME" --only-show-errors > /dev/null; then
            echo "NSG not found: $AZURE_NSG_NAME in resource group: $AZURE_RESOURCE_GROUP"
            echo "Listing NSGs in the target resource group:"
            az network nsg list --resource-group "$AZURE_RESOURCE_GROUP" --query "[].{name:name,location:location}" -o table
            echo "Searching for the requested NSG name across the subscription:"
            az network nsg list --query "[?name=='$AZURE_NSG_NAME'].{name:name,resourceGroup:resourceGroup,location:location}" -o table
            exit 4
          fi

          echo "Validated target resource group and NSG."
          az network nsg show --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_NSG_NAME" \
            --query "{id:id,name:name,location:location,provisioningState:provisioningState}" -o table

      - name: Create temporary NSG allow rule for runner IP
        id: nsg_rule
        shell: bash
        run: |
          set -euo pipefail

          RULE_NAME="${AZURE_RULE_BASE_NAME}-${GITHUB_RUN_ID}"
          SOURCE_CIDR="${{ steps.runner_ip.outputs.runner_ip }}/32"

          echo "rule_name=$RULE_NAME" >> "$GITHUB_OUTPUT"
          echo "source_cidr=$SOURCE_CIDR" >> "$GITHUB_OUTPUT"

          az network nsg rule create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$AZURE_NSG_NAME" \
            --name "$RULE_NAME" \
            --priority "$AZURE_RULE_PRIORITY" \
            --access Allow \
            --direction "$AZURE_DIRECTION" \
            --protocol "$AZURE_PROTOCOL" \
            --source-address-prefixes "$SOURCE_CIDR" \
            --destination-address-prefixes "$AZURE_DESTINATION_PREFIX" \
            --destination-port-ranges "$AZURE_DEST_PORTS" \
            -o table

      - name: Verify NSG rule update output
        shell: bash
        run: |
          set -euo pipefail

          RULE_NAME="${{ steps.nsg_rule.outputs.rule_name }}"
          EXPECTED_SOURCE="${{ steps.nsg_rule.outputs.source_cidr }}"

          ACTUAL_SOURCE="$(az network nsg rule show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$AZURE_NSG_NAME" \
            --name "$RULE_NAME" \
            --query sourceAddressPrefix -o tsv)"

          echo "Rule verification details:"
          az network nsg rule show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$AZURE_NSG_NAME" \
            --name "$RULE_NAME" \
            --query "{name:name,priority:priority,access:access,direction:direction,protocol:protocol,source:sourceAddressPrefix,destination:destinationAddressPrefix,destinationPorts:destinationPortRange,state:provisioningState}" \
            -o table

          if [[ "$ACTUAL_SOURCE" != "$EXPECTED_SOURCE" ]]; then
            echo "NSG rule source mismatch. Expected: $EXPECTED_SOURCE, Actual: $ACTUAL_SOURCE"
            exit 1
          fi

      - name: Simulate IaC deployment
        shell: bash
        run: |
          set -euo pipefail
          echo "Simulating IaC deployment command..."
          az group show --name "$AZURE_RESOURCE_GROUP" --query "{name:name,location:location}" -o table
          echo "Waiting 120 seconds to simulate deployment runtime..."
          sleep 120

      - name: Revert NSG change (always)
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          RULE_NAME="${{ steps.nsg_rule.outputs.rule_name }}"

          if [[ -z "$RULE_NAME" ]]; then
            echo "No rule name recorded; skipping cleanup."
            exit 0
          fi

          az network nsg rule delete \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$AZURE_NSG_NAME" \
            --name "$RULE_NAME"

          echo "Cleanup complete. Deleted rule: $RULE_NAME"

      - name: Verify NSG rule cleanup (always)
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          RULE_NAME="${{ steps.nsg_rule.outputs.rule_name }}"

          if [[ -z "$RULE_NAME" ]]; then
            echo "No rule name recorded; nothing to verify."
            exit 0
          fi

          if az network nsg rule show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --nsg-name "$AZURE_NSG_NAME" \
            --name "$RULE_NAME" \
            --only-show-errors > /dev/null 2>&1; then
            echo "Cleanup verification failed: rule still exists: $RULE_NAME"
            exit 1
          fi

          echo "Cleanup verification succeeded: rule is removed: $RULE_NAME"
